
---
layout: default
---
<article class="post">
    <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <div class="post-meta">
            <span class="post-date">{{ page.date | date: "%d %b %Y" }}</span>
            <span class="post-category">{{ page.categories }}</span>
        </div>
    </header>
    <div class="post-content">
        {{ content }}
    </div>
    <div class="post-footer">
        <a href="{{ site.baseurl }}/" class="back-link">&larr; Kembali ke Daftar Dokumen</a>
    </div>
</article>
